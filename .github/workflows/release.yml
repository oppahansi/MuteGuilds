name: Release

# Pushing a version tag like 0.4.0 packages the addon and publishes it to
# CurseForge and as a GitHub release. The tag is the version number on its own,
# with no "v" in front, because the packager puts the tag into the file name.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, for the changelog

      - uses: BigWigsMods/packager@v2
        with:
          # File name, then the name shown on CurseForge: MuteGuilds-0.4.0(.zip),
          # without the "-forever" the packager would add for this client.
          args: -n "{package-name}-{project-version}:{package-name}-{project-version}"
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
